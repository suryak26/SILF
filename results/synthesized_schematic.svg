<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="arrc" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#B58900"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="960" fill="#FFFFFF"/>
  <text x="20" y="36" font-size="22" font-weight="bold" fill="#1a1a1a">PALUTE lut_gen_unit — Synthesized Structure</text>
  <text x="20" y="58" font-size="13" fill="#666">Sky130 sky130_fd_sc_hd · Yosys + OpenLane 2.3.10 · RUN 2026-09-12_10-24-58 · die 950 × 950 µm · instance area 77,610.7 µm²</text>

  <!-- ================= INPUT PORTS ================= -->
  <g font-size="12" fill="#333">
    <text x="24" y="176">clk</text>
    <text x="24" y="201">rst_n</text>
    <text x="24" y="226">start</text>
    <text x="24" y="251">u</text>
    <text x="24" y="291">x1[3:0]</text>
    <text x="24" y="321">x2[3:0]</text>
  </g>
  <g stroke="#555" stroke-width="1.2">
    <line x1="60" y1="172" x2="170" y2="135" marker-end="url(#arr)"/>
    <line x1="58" y1="197" x2="170" y2="145" marker-end="url(#arr)"/>
    <line x1="62" y1="222" x2="170" y2="155" marker-end="url(#arr)"/>
    <line x1="40" y1="247" x2="170" y2="165" marker-end="url(#arr)"/>
    <line x1="78" y1="287" x2="170" y2="275" marker-end="url(#arr)"/>
    <line x1="78" y1="317" x2="170" y2="295" marker-end="url(#arr)"/>
  </g>

  <!-- ================= CONTROL FSM ================= -->
  <rect x="170" y="100" width="700" height="70" rx="8" fill="#FDF3E7" stroke="#D9822B" stroke-width="1.5"/>
  <text x="182" y="122" font-size="14" font-weight="bold" fill="#8a5a00">CONTROL FSM</text>
  <text x="182" y="140" font-size="12" fill="#555">IDLE → GEN_W1 → GEN_W2_POS → GEN_W2_NEG · 3-bit state reg + done flag</text>
  <text x="182" y="156" font-size="11" fill="#999">synthesized → dfrtp flip-flops + nand2/nor2 next-state decode</text>
  <g stroke="#B58900" stroke-width="1" stroke-dasharray="4 3">
    <line x1="240" y1="170" x2="240" y2="208" marker-end="url(#arrc)"/>
    <line x1="700" y1="170" x2="700" y2="208" marker-end="url(#arrc)"/>
    <line x1="1180" y1="170" x2="1180" y2="208" marker-end="url(#arrc)"/>
  </g>
  <text x="244" y="204" font-size="10" fill="#B58900">en</text>
  <text x="704" y="204" font-size="10" fill="#B58900">en</text>
  <text x="1184" y="204" font-size="10" fill="#B58900">en</text>

  <!-- ================= INPUT REGISTERS ================= -->
  <rect x="170" y="210" width="130" height="130" rx="8" fill="#EAF6EC" stroke="#4E9A57" stroke-width="1.5"/>
  <text x="182" y="232" font-size="12" font-weight="bold" fill="#2d6a33">INPUT REGISTERS</text>
  <text x="182" y="252" font-size="11" fill="#333">x1_reg[3:0]</text>
  <text x="182" y="268" font-size="11" fill="#333">x2_reg[3:0]</text>
  <text x="182" y="284" font-size="11" fill="#333">u_reg</text>
  <text x="182" y="308" font-size="10" fill="#7a7a7a">→ dfrtp (9 FF)</text>

  <!-- ================= MEGA-MULTIPLIER BANK ================= -->
  <rect x="360" y="170" width="220" height="340" rx="8" fill="#E8F1FB" stroke="#4A7FB5" stroke-width="1.5"/>
  <text x="372" y="192" font-size="13" font-weight="bold" fill="#2a5a8a">MEGA-MULTIPLIER BANK</text>
  <text x="372" y="209" font-size="11" fill="#555">15 lanes · product = x × w</text>
  <rect x="378" y="222" width="184" height="118" rx="4" fill="#FFFFFF" stroke="#9bb8d4"/>
  <text x="388" y="238" font-size="11" font-weight="bold" fill="#2a5a8a">W1 bank — 8 lanes</text>
  <g fill="#cfe0f1">
    <rect x="388" y="246" width="164" height="10"/><rect x="388" y="260" width="164" height="10"/>
    <rect x="388" y="274" width="164" height="10"/><rect x="388" y="288" width="164" height="10"/>
    <rect x="388" y="302" width="164" height="10"/><rect x="388" y="316" width="164" height="10"/>
    <rect x="388" y="330" width="164" height="10"/>
  </g>
  <text x="388" y="336" font-size="10" fill="#2a5a8a">×1</text>
  <rect x="378" y="352" width="184" height="106" rx="4" fill="#FFFFFF" stroke="#9bb8d4"/>
  <text x="388" y="368" font-size="11" font-weight="bold" fill="#2a5a8a">W2 bank — 7 lanes</text>
  <g fill="#cfe0f1">
    <rect x="388" y="376" width="164" height="10"/><rect x="388" y="390" width="164" height="10"/>
    <rect x="388" y="404" width="164" height="10"/><rect x="388" y="418" width="164" height="10"/>
    <rect x="388" y="432" width="164" height="10"/><rect x="388" y="446" width="164" height="10"/>
  </g>
  <text x="388" y="452" font-size="10" fill="#2a5a8a">×1</text>
  <text x="372" y="476" font-size="10.5" fill="#a33">v1 RTL: w is a compile-time constant ⇒ Yosys</text>
  <text x="372" y="490" font-size="10.5" fill="#a33">rebuilt each lane as constant shift-add logic</text>
  <text x="372" y="504" font-size="10.5" fill="#a33">(~22–29 gates) — no multiplier hardware exists</text>

  <!-- ================= PRODUCT REGISTERS ================= -->
  <rect x="630" y="170" width="140" height="160" rx="8" fill="#EAF6EC" stroke="#4E9A57" stroke-width="1.5"/>
  <text x="642" y="192" font-size="12" font-weight="bold" fill="#2d6a33">PRODUCT REGISTERS</text>
  <text x="642" y="213" font-size="11" fill="#333">prod_w1[7:0]</text>
  <text x="642" y="228" font-size="10" fill="#888">8 lanes × 8-bit</text>
  <text x="642" y="248" font-size="11" fill="#333">prod_w2_pos[6:0]</text>
  <text x="642" y="263" font-size="10" fill="#888">7 lanes × 8-bit</text>
  <text x="642" y="292" font-size="10" fill="#7a7a7a">→ dfrtp (120 FF in RTL;</text>
  <text x="642" y="306" font-size="10" fill="#7a7a7a">synthesis may bypass)</text>

  <!-- ================= NEGATION ================= -->
  <rect x="630" y="352" width="140" height="76" rx="8" fill="#E8F1FB" stroke="#4A7FB5" stroke-width="1.5"/>
  <text x="642" y="372" font-size="11" font-weight="bold" fill="#2a5a8a">NEGATION</text>
  <text x="642" y="390" font-size="10.5" fill="#333">neg_w2[j] =</text>
  <text x="642" y="404" font-size="10.5" fill="#333">−prod_w2_pos[j]</text>
  <text x="642" y="420" font-size="10" fill="#7a7a7a">→ inv / xor gates</text>

  <!-- ================= MEGA-ADDER BANK ================= -->
  <rect x="820" y="170" width="210" height="400" rx="8" fill="#E8F1FB" stroke="#4A7FB5" stroke-width="1.5"/>
  <text x="832" y="192" font-size="13" font-weight="bold" fill="#2a5a8a">MEGA-ADDER BANK</text>
  <text x="832" y="210" font-size="11" fill="#555">112 × mega_adder (8b + 8b → 9b)</text>
  <text x="832" y="233" font-size="11" fill="#333">add_pos[i][j] =</text>
  <text x="832" y="248" font-size="11" fill="#333">prod_w1[i] + prod_w2_pos[j]</text>
  <text x="832" y="271" font-size="11" fill="#333">add_neg[i][j] =</text>
  <text x="832" y="286" font-size="11" fill="#333">prod_w1[i] − prod_w2_pos[j]</text>
  <line x1="832" y1="300" x2="1018" y2="300" stroke="#9bb8d4"/>
  <text x="832" y="320" font-size="10.5" fill="#555">synthesized → composite AO/OA + XOR:</text>
  <text x="832" y="336" font-size="10.5" fill="#333">a21o 362 · a32o 302 · a22o 168</text>
  <text x="832" y="351" font-size="10.5" fill="#333">a211o 67 · a31o 70 · a21bo 40 …</text>
  <text x="832" y="366" font-size="10.5" fill="#333">nand2 405 · or2 298 · xnor2 99</text>
  <text x="832" y="381" font-size="10.5" fill="#333">xor2 38 · mux2 35 · and2 96 …</text>
  <text x="832" y="407" font-size="10" fill="#a33">sky130 has NO full-adder cell —</text>
  <text x="832" y="421" font-size="10" fill="#a33">sums &amp; carries are built from</text>
  <text x="832" y="435" font-size="10" fill="#a33">composite AOI / XOR gate networks</text>

  <!-- ================= LUT OUTPUT REGISTERS ================= -->
  <rect x="1080" y="170" width="200" height="400" rx="8" fill="#F3EAF8" stroke="#8E5BA6" stroke-width="1.5"/>
  <text x="1092" y="192" font-size="12" font-weight="bold" fill="#5d3a75">LUT OUTPUT REGISTER ARRAY</text>
  <text x="1092" y="211" font-size="11" fill="#333">lut_out_flat — 112 entries × 9-bit</text>
  <text x="1092" y="226" font-size="10" fill="#888">(1,008 FF in RTL)</text>
  <g>
    <rect x="1092" y="240" width="84" height="16" fill="#e6d9f0" stroke="#8E5BA6"/>
    <rect x="1180" y="240" width="84" height="16" fill="#f7e6ec" stroke="#8E5BA6"/>
    <text x="1100" y="252" font-size="9" fill="#5d3a75">+|w2| ×7</text>
    <text x="1188" y="252" font-size="9" fill="#5d3a75">−|w2| ×7</text>
    <text x="1092" y="274" font-size="9.5" fill="#888">row i (w1 = i+1), 8 rows total</text>
  </g>
  <text x="1092" y="298" font-size="10.5" fill="#555">u = 0 : only first 8 entries</text>
  <text x="1092" y="313" font-size="10.5" fill="#555">written (w1 products)</text>
  <text x="1092" y="345" font-size="10.5" fill="#555">→ dfrtp array</text>
  <text x="1092" y="361" font-size="10.5" fill="#555">741 flip-flops in design</text>
  <text x="1092" y="377" font-size="10.5" fill="#555">(698 dfrtp + 43 dfxtp)</text>

  <!-- ================= OUTPUT PORTS ================= -->
  <g stroke="#555" stroke-width="1.2">
    <line x1="1280" y1="210" x2="1330" y2="210" marker-end="url(#arr)"/>
    <line x1="1280" y1="330" x2="1330" y2="330" marker-end="url(#arr)"/>
  </g>
  <text x="1318" y="204" font-size="12" fill="#333">done</text>
  <text x="1305" y="324" font-size="11" fill="#333">lut_out_flat</text>
  <text x="1305" y="340" font-size="10" fill="#888">[1007:0]</text>

  <!-- ================= DATAFLOW ARROWS ================= -->
  <g stroke="#555" stroke-width="1.4">
    <line x1="300" y1="275" x2="360" y2="275" marker-end="url(#arr)"/>
    <line x1="300" y1="295" x2="360" y2="390" marker-end="url(#arr)"/>
    <line x1="580" y1="235" x2="630" y2="235" marker-end="url(#arr)"/>
    <line x1="580" y1="405" x2="630" y2="405" marker-end="url(#arr)"/>
    <line x1="770" y1="235" x2="820" y2="235" marker-end="url(#arr)"/>
    <line x1="770" y1="390" x2="820" y2="390" marker-end="url(#arr)"/>
    <line x1="1030" y1="330" x2="1080" y2="330" marker-end="url(#arr)"/>
  </g>

  <!-- ================= CLOCK TREE NOTE ================= -->
  <rect x="170" y="586" width="410" height="56" rx="8" fill="#F5F5F5" stroke="#aaa"/>
  <text x="182" y="608" font-size="11" font-weight="bold" fill="#555">CLOCK TREE (OpenROAD CTS)</text>
  <text x="182" y="626" font-size="10.5" fill="#666">clk → clkbuf_1/2/4/8/16 (717) + clkinv/clkinvlp (50) · hold fixed with dlygate4sd3 (462)</text>

  <!-- ================= CELL INVENTORY BAND ================= -->
  <rect x="20" y="666" width="1320" height="274" rx="10" fill="#FAFAFA" stroke="#ccc"/>
  <text x="36" y="692" font-size="14" font-weight="bold" fill="#1a1a1a">STANDARD-CELL COMPONENTS — sky130_fd_sc_hd (final signed-off netlist)</text>

  <!-- Col 1: sequential -->
  <rect x="36" y="706" width="240" height="222" rx="6" fill="#FFFFFF" stroke="#4E9A57"/>
  <text x="50" y="728" font-size="12" font-weight="bold" fill="#2d6a33">SEQUENTIAL — 741</text>
  <text x="50" y="750" font-size="11" fill="#333">dfrtp_1 · 461</text>
  <text x="50" y="766" font-size="11" fill="#333">dfrtp_4 · 160 · dfrtp_2 · 77</text>
  <text x="50" y="782" font-size="11" fill="#333">dfxtp_1/2/4 · 43</text>
  <text x="50" y="804" font-size="10" fill="#888">D-FF, rising edge, async reset (dfrtp)</text>
  <text x="50" y="818" font-size="10" fill="#888">D-FF, no reset (dfxtp)</text>
  <text x="50" y="840" font-size="10" fill="#888">drive strength _1 &lt; _2 &lt; _4 &lt; _8 &lt; _16</text>
  <text x="50" y="856" font-size="10" fill="#888">hold state + x1/x2/u regs + LUT bits</text>
  <text x="50" y="878" font-size="10" fill="#a33">all storage in the design is DFFs —</text>
  <text x="50" y="892" font-size="10" fill="#a33">no memory macro was used</text>

  <!-- Col 2: combinational -->
  <rect x="292" y="706" width="320" height="222" rx="6" fill="#FFFFFF" stroke="#4A7FB5"/>
  <text x="306" y="728" font-size="12" font-weight="bold" fill="#2a5a8a">COMBINATIONAL LOGIC — ≈2,900</text>
  <text x="306" y="750" font-size="11" fill="#333">AND-OR composites · 1,177</text>
  <text x="306" y="765" font-size="10" fill="#888">a21o=(A1·A2)+B1 · a32o=(A1·A2·A3)+(B1·B2)</text>
  <text x="306" y="779" font-size="10" fill="#888">a22o · a211o · a31o · a21bo · a2bb2o · …30+ variants</text>
  <text x="306" y="799" font-size="11" fill="#333">OR-AND composites · 274</text>
  <text x="306" y="813" font-size="10" fill="#888">o21ai=NOT((A1|A2)·B1) · o21a · o211ai · …</text>
  <text x="306" y="833" font-size="11" fill="#333">NAND/NOR family · 674 (nand2 405, nor2 153, …)</text>
  <text x="306" y="853" font-size="11" fill="#333">AND/OR family · 578 (or2 298, and3 91, …)</text>
  <text x="306" y="873" font-size="11" fill="#333">XOR/XNOR · 137 · MUX2 · 35 · constants · 28</text>
  <text x="306" y="895" font-size="10" fill="#a33">arithmetic = adder/multiplier equations mapped</text>
  <text x="306" y="909" font-size="10" fill="#a33">onto these composite gates by ABC</text>

  <!-- Col 3: interconnect -->
  <rect x="628" y="706" width="290" height="222" rx="6" fill="#FFFFFF" stroke="#B58900"/>
  <text x="642" y="728" font-size="12" font-weight="bold" fill="#8a5a00">INTERCONNECT &amp; TIMING — ≈2,710</text>
  <text x="642" y="750" font-size="11" fill="#333">buf_1/2/4/6/8/12 · 1,302 — buffers</text>
  <text x="642" y="766" font-size="11" fill="#333">inv_2/4/6/8/12/16 · 153 — inverters</text>
  <text x="642" y="782" font-size="11" fill="#333">dlygate4sd3 · 462 + dlymetal6s2s · 11</text>
  <text x="642" y="798" font-size="10" fill="#888">— hold-violation repair delay cells</text>
  <text x="642" y="818" font-size="11" fill="#333">clkbuf_1/2/4/8/16 · 717 — clock tree</text>
  <text x="642" y="834" font-size="11" fill="#333">clkinv / clkinvlp · 50</text>
  <text x="642" y="856" font-size="10" fill="#888">inserted by CTS + post-CTS timing repair</text>
  <text x="642" y="872" font-size="10" fill="#888">(not hand-instantiated in RTL)</text>

  <!-- Col 4: physical -->
  <rect x="934" y="706" width="394" height="222" rx="6" fill="#FFFFFF" stroke="#888"/>
  <text x="948" y="728" font-size="12" font-weight="bold" fill="#555">PHYSICAL-ONLY CELLS — ≈40,060 (no logic function)</text>
  <text x="948" y="750" font-size="11" fill="#333">tapvpwrvgnd_1 · 12,348 — well taps</text>
  <text x="948" y="766" font-size="11" fill="#333">fill_1 / fill_2 · 12,914 — fill</text>
  <text x="948" y="782" font-size="11" fill="#333">decap_3/4/6/8 · 14,534 — decoupling cap</text>
  <text x="948" y="798" font-size="11" fill="#333">diode_2 · 264 — antenna protection</text>
  <text x="948" y="820" font-size="10" fill="#888">inserted by OpenROAD after placement/routing:</text>
  <text x="948" y="834" font-size="10" fill="#888">taps for latch-up rule, fill for density,</text>
  <text x="948" y="848" font-size="10" fill="#888">decap for IR integrity, diodes for antenna checks</text>
  <text x="948" y="876" font-size="10" fill="#a33">functional logic + storage ≈ 6,600 cells (incl.</text>
  <text x="948" y="890" font-size="10" fill="#a33">clock tree); the 18,963-stage figure = logic + taps</text>

  <text x="20" y="962" font-size="10" fill="#999">Generated from RUN_2026-09-12_10-24-58 final netlist (v1 constant-magnitude RTL). SILG+ and the runtime-multiplier baseline will be compared against these numbers under identical flow conditions.</text>
</svg>